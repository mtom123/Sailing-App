<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>TIMONE · prova carta veloce</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.css">
<style>
  html, body { margin: 0; height: 100%; background: #0a1620; font-family: -apple-system, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .panel { position: absolute; z-index: 2; background: rgba(10, 22, 32, 0.88); color: #e8eef2; border-radius: 10px; padding: 8px; font-size: 13px; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
  #places { top: max(10px, env(safe-area-inset-top)); left: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 80px); }
  #layers { bottom: max(28px, env(safe-area-inset-bottom)); left: 10px; display: flex; flex-direction: column; gap: 6px; }
  #meter { top: max(10px, env(safe-area-inset-top)); right: 56px; min-width: 150px; }
  button { font: inherit; color: #e8eef2; background: rgba(46, 217, 168, 0.12); border: 1px solid #2bd9a8; border-radius: 7px; padding: 6px 10px; }
  label { display: flex; align-items: center; gap: 8px; }
  input[type=checkbox] { width: 20px; height: 20px; accent-color: #2bd9a8; }
  #meter b { color: #2bd9a8; font-size: 15px; }
  #meter .bad { color: #ff5252; }
  .note { color: #9ba0a6; font-size: 11px; }
  a { color: #2bd9a8; }
</style>
</head>
<body>
<div id="map"></div>
<div id="places" class="panel">
  <button data-go="8.9382,44.3942,15.5">Genova Fiera</button>
  <button data-go="8.3360,44.1625,15">Finale (San Donato)</button>
  <button data-go="9.2735,41.5285,15">Santa Giulia</button>
  <button data-go="9.2760,41.4780,15">Porto Novo</button>
  <a href="./" style="align-self:center;margin-left:4px">← TIMONE</a>
</div>
<div id="meter" class="panel">
  <div>Blocchi: <b id="stalls">0</b></div>
  <div>Il più lungo: <b id="worst">0</b> ms</div>
  <div class="note">fermo &gt; 100 ms mentre muovi</div>
  <button id="reset" style="margin-top:6px;padding:3px 8px">Azzera</button>
</div>
<div id="layers" class="panel">
  <label><input type="checkbox" data-layer="ow" checked> Fondali Open Waters</label>
  <label><input type="checkbox" data-layer="bands" checked> Fasce EMODnet</label>
  <label><input type="checkbox" data-layer="emodnet" checked> Isobate EMODnet</label>
  <label><input type="checkbox" data-layer="liguria" checked> Isobate Regione Liguria (Finale)</label>
  <div class="note">Prova: non per la navigazione</div>
</div>
<script type="module">
import * as maplibregl from 'https://unpkg.com/maplibre-gl@6.17.0/dist/maplibre-gl.mjs'

const AREAS = ['genova', 'finale', 'corsica']
const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openwaters.io/seamap/style.json',
  center: [8.9382, 44.3942],
  zoom: 15,
  attributionControl: { compact: true },
})
map.addControl(new maplibregl.NavigationControl({ visualizePitch: false }), 'top-right')
map.addControl(new maplibregl.GeolocateControl({ positionOptions: { enableHighAccuracy: true }, trackUserLocation: true }), 'top-right')
map.addControl(new maplibregl.ScaleControl({ unit: 'nautical' }), 'bottom-right')

// Fondali di Open Waters (Seascape), accesi e spenti insieme
const OW_LAYERS = ['depth-shading', 'depth-areas', 'unsurveyed', 'depth-hillshade', 'contour-lines', 'contour-labels', 'soundings']
const BAND_COLORS = { 20: ['#c3ddf1', 0.55], 10: ['#97c4e7', 0.6], 5: ['#6aa9db', 0.65], 2: ['#3f8fd0', 0.7] }
const groups = { ow: OW_LAYERS, bands: [], emodnet: [], liguria: [] }

map.on('load', () => {
  // Sotto la terra della carta: la costa OSM taglia fasce e linee al metro
  const before = 'land_area'
  for (const a of AREAS) {
    map.addSource(`${a}-bands`, { type: 'geojson', data: `prova-carta/${a}-emodnet-bands.geojson` })
    for (const d of [20, 10, 5, 2]) {
      const id = `${a}-band-${d}`
      map.addLayer({ id, type: 'fill', source: `${a}-bands`, filter: ['==', ['get', 'depth'], d], paint: { 'fill-color': BAND_COLORS[d][0], 'fill-opacity': BAND_COLORS[d][1] } }, before)
      groups.bands.push(id)
    }
    map.addSource(`${a}-lines`, { type: 'geojson', data: `prova-carta/${a}-emodnet-lines.geojson` })
    map.addLayer({ id: `${a}-emodnet`, type: 'line', source: `${a}-lines`, paint: { 'line-color': '#0b3d91', 'line-width': ['case', ['<=', ['get', 'depth'], 10], 1.6, 1], 'line-dasharray': [3, 2] } }, before)
    map.addLayer({
      id: `${a}-emodnet-labels`, type: 'symbol', source: `${a}-lines`, minzoom: 12,
      layout: { 'symbol-placement': 'line', 'text-field': ['to-string', ['get', 'depth']], 'text-font': ['Noto Sans Medium'], 'text-size': 12, 'text-max-angle': 30, 'symbol-spacing': 250 },
      paint: { 'text-color': '#0b3d91', 'text-halo-color': 'rgba(255,255,255,0.85)', 'text-halo-width': 1.5 },
    })
    groups.emodnet.push(`${a}-emodnet`, `${a}-emodnet-labels`)
  }
  // Isobate multibeam della Regione Liguria (Finale): ogni metro sotto costa
  map.addSource('liguria', { type: 'geojson', data: 'prova-carta/finale-liguria-lines.geojson' })
  map.addLayer({
    id: 'liguria-lines', type: 'line', source: 'liguria', minzoom: 12,
    filter: ['any', ['<=', ['get', 'depth'], 3], ['==', ['%', ['get', 'depth'], 5], 0], ['>=', ['zoom'], 16]],
    paint: { 'line-color': '#7a1fa2', 'line-width': ['case', ['==', ['%', ['get', 'depth'], 5], 0], 1.4, 0.7] },
  }, before)
  map.addLayer({
    id: 'liguria-labels', type: 'symbol', source: 'liguria', minzoom: 14,
    filter: ['any', ['<=', ['get', 'depth'], 3], ['==', ['%', ['get', 'depth'], 5], 0]],
    layout: { 'symbol-placement': 'line', 'text-field': ['to-string', ['get', 'depth']], 'text-font': ['Noto Sans Medium'], 'text-size': 12, 'text-max-angle': 30, 'symbol-spacing': 300 },
    paint: { 'text-color': '#7a1fa2', 'text-halo-color': 'rgba(255,255,255,0.85)', 'text-halo-width': 1.5 },
  })
  groups.liguria.push('liguria-lines', 'liguria-labels')
})

document.querySelectorAll('[data-layer]').forEach((box) => {
  box.addEventListener('change', () => {
    for (const id of groups[box.dataset.layer]) if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', box.checked ? 'visible' : 'none')
  })
})
document.querySelectorAll('[data-go]').forEach((b) => {
  b.addEventListener('click', () => {
    const [lon, lat, zoom] = b.dataset.go.split(',').map(Number)
    map.jumpTo({ center: [lon, lat], zoom })
  })
})

// Misura dei blocchi: fotogrammi più lunghi di 100 ms mentre la carta si muove
let stalls = 0
let worst = 0
let last = performance.now()
let moving = false
map.on('movestart', () => (moving = true))
map.on('moveend', () => setTimeout(() => (moving = false), 1500))
const tick = (now) => {
  const gap = now - last
  if (gap > 100 && document.visibilityState === 'visible' && moving) {
    stalls++
    worst = Math.max(worst, Math.round(gap))
    document.getElementById('stalls').textContent = stalls
    const w = document.getElementById('worst')
    w.textContent = worst
    w.className = worst > 300 ? 'bad' : ''
  }
  last = now
  requestAnimationFrame(tick)
}
requestAnimationFrame(tick)
document.addEventListener('visibilitychange', () => (last = performance.now()))
document.getElementById('reset').addEventListener('click', () => {
  stalls = 0
  worst = 0
  document.getElementById('stalls').textContent = '0'
  document.getElementById('worst').textContent = '0'
})
window.__map = map
</script>
</body>
</html>
